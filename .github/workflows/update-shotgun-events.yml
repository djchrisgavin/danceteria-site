name: Update Shotgun agenda

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/update-shotgun-events.yml'
      - 'tools/sync_shotgun.py'
      - 'shotgun-portrait-overrides.json'

permissions:
  contents: write

concurrency:
  group: shotgun-agenda-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SHOTGUN_API_TOKEN: ${{ secrets.SHOTGUN_API_TOKEN }}
      SHOTGUN_ORGANIZER_ID: '175441'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync and publish Shotgun events
        run: |
          git config user.name "Danceteria Bot"
          git config user.email "actions@users.noreply.github.com"

          # Always regenerate from the latest main branch. This avoids conflicts
          # if another workflow or manual commit lands while the job is running.
          git fetch origin main
          git reset --hard origin/main
          python3 tools/sync_shotgun.py

          if git diff --quiet -- events.json; then
            echo "No Shotgun agenda changes."
            exit 0
          fi

          git add events.json
          git commit -m "Update agenda from Shotgun"

          if git push origin HEAD:main; then
            exit 0
          fi

          # One retry from the newest main in the unlikely event of a race.
          git fetch origin main
          git reset --hard origin/main
          python3 tools/sync_shotgun.py

          if git diff --quiet -- events.json; then
            echo "Agenda already updated by another run."
            exit 0
          fi

          git add events.json
          git commit -m "Update agenda from Shotgun"
          git push origin HEAD:main
